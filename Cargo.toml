[package]
name = "svmic"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
bytes = "1.12.1"
dotenvy = "0.15.7"
egui = "0.36.2"
eframe = "0.36.2"
futures-util = "0.3.34"
hound = "3.5.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-rustls = "0.27.9"
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
ringbuf = "0.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
